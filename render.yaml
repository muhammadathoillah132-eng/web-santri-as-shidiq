services:
  - type: web
    name: asshidiq-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: test_database
      - key: CORS_ORIGINS
        value: https://santriasshidiq.my.id,https://www.santriasshidiq.my.id
      - key: OWNER_EMAIL
        value: akayfikanita@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.16
